repos:
  - repo: local
    hooks:
      - id: audit-skills
        name: audit-skills (search discipline)
        entry: scripts/audit-skills.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: no-banned-phrases
        name: no banned phrases in skills
        entry: scripts/check-banned-phrases.sh
        language: system
        files: '^skills/.*/SKILL\.md$'
        stages: [pre-commit]
